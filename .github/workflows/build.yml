name: Build PAIA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.0'
  WORKING_DIR: app
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Android ─────────────────────────────────────────────────────────────────
  android-debug:
    name: Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Write local.properties (pin flutter.sdk for Gradle)
        working-directory: ${{ env.WORKING_DIR }}
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter pub get

      - name: Build debug APK
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter build apk --debug 

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: ${{ env.WORKING_DIR }}/build/app/outputs/flutter-apk/app-debug.apk

  # ── iOS ─────────────────────────────────────────────────────────────────────
  ios-debug:
    name: iOS Debug (no-codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter pub get

      - name: Build iOS debug (no codesign)
        working-directory: ${{ env.WORKING_DIR }}
        run: flutter build ios --debug --no-codesign

      - uses: actions/upload-artifact@v4
        with:
          name: ios-debug-app
          path: ${{ env.WORKING_DIR }}/build/ios/iphoneos/Runner.app
